[project]
name = "clickstream-sessionization"
version = "1.0.0"
description = "Event-time-gap sessionization pipeline for clickstream events (Python + SQLite SQL)."
requires-python = ">=3.11"
dependencies = []          # runtime uses the Python standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
